# Production stack for one EC2 host. deploy-api.yml / deploy-frontend.yml copy this file to
# ~/knowledge-engine on every deploy, so the server always has the repo's version.
#
# Server layout:
#   ~/knowledge-engine/
#     docker-compose.prod.yaml   <- this file
#     .env.api                   <- runtime config for backend + worker, written by deploy-api
#                                   from the API_ENV_FILE secret (see apps/backend/.env.example)
#     .env.frontend              <- runtime config for web, written by deploy-frontend from the
#                                   FRONTEND_ENV_FILE secret. Server-side vars only: NEXT_PUBLIC_* are
#                                   baked into the browser bundle at build time (build-image.yml).
#
# DOCKERHUB_USERNAME and BACKEND_TAG / WORKER_TAG / WEB_TAG are passed in by the deploy jobs.
# Running Compose by hand on the server? Set them yourself, e.g.
#   DOCKERHUB_USERNAME=me WEB_TAG=<sha> docker compose -f docker-compose.prod.yaml up -d --no-deps web
#
# The env files are `required: false` so deploying one app works before the other has ever been
# deployed (Compose checks every service's env_file when it loads this file).
#
# Postgres (RDS), S3 and SQS live outside this file and are configured through .env.api.
# Image health checks (backend: /metrics, web: /) come from the Dockerfiles, so
# `docker compose up -d --wait` fails if a container never becomes healthy.

name: knowledge-engine

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  backend:
    <<: *defaults
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in .env}/knowledge-engine-backend:${BACKEND_TAG:-latest}
    env_file:
      - path: .env.api
        required: false
    environment:
      PORT: 5000 # must match the image's EXPOSE/HEALTHCHECK, whatever .env.api says
    ports:
      - "5000:5000"

  worker:
    <<: *defaults
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in .env}/knowledge-engine-worker:${WORKER_TAG:-latest}
    env_file:
      - path: .env.api
        required: false
    # Let in-flight SQS messages finish; main-worker.ts handles SIGTERM.
    stop_grace_period: 30s

  web:
    <<: *defaults
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in .env}/knowledge-engine-web:${WEB_TAG:-latest}
    env_file:
      - path: .env.frontend
        required: false
    ports:
      - "3000:3000"
