name: Deploy to EC2

on:
  workflow_call:
    inputs:
      apps:
        description: Space-separated images to update, e.g. "backend worker web". Others keep their current tag.
        type: string
        required: true
      image_tag:
        description: Image tag to deploy (defaults to the triggering commit SHA). Pass an older SHA to roll back.
        type: string
        required: false
      deploy_dir:
        description: Directory on the server holding the Compose file (relative to the SSH user's home, or absolute).
        type: string
        default: knowledge-engine
      compose_file:
        description: Compose file name inside deploy_dir.
        type: string
        default: docker-compose.prod.yaml

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      EC2_HOST:
        required: true
      EC2_USER:
        required: true
      EC2_SSH_KEY:
        required: true
      EC2_SSH_PORT:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APPS: ${{ inputs.apps }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          DEPLOY_DIR: ${{ inputs.deploy_dir }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,APPS,IMAGE_TAG,DEPLOY_DIR,COMPOSE_FILE
          command_timeout: 10m
          script: |
            set -eu

            cd "$DEPLOY_DIR"
            compose() { docker compose -f "$COMPOSE_FILE" "$@"; }

            # Per-image tags live in .env (Compose reads it for ${VAR} interpolation).
            # Keep a copy so a failed deploy can go back to the previous tags.
            touch .env
            cp .env .env.previous
            deployed=false

            on_exit() {
              if [ "$deployed" != true ]; then
                echo "Deploy failed: restoring previous image tags" >&2
                cp .env.previous .env
                compose up -d --remove-orphans || echo "Restore failed too: check the server manually" >&2
              fi
              docker logout >/dev/null 2>&1 || true
            }
            trap on_exit EXIT

            # Only the listed images move to the new tag; the rest stay where they are.
            for app in $APPS; do
              var="$(echo "$app" | tr '[:lower:]' '[:upper:]')_TAG"   # backend -> BACKEND_TAG
              sed -i "/^$var=/d" .env
              echo "$var=$IMAGE_TAG" >> .env
            done

            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "Deploying [$APPS] at $IMAGE_TAG from $PWD/$COMPOSE_FILE"
            compose pull
            # --wait blocks until containers are running/healthy and fails otherwise.
            compose up -d --remove-orphans --wait --wait-timeout 180

            # --wait accepts containers without a health check (worker) as soon as they start,
            # so give them a moment and fail if anything is crash-looping.
            sleep 20
            if [ -n "$(compose ps -q --status restarting --status exited)" ]; then
              compose ps -a
              echo "A container is restarting or exited after start" >&2
              exit 1
            fi

            deployed=true
            compose ps
            docker image prune -f
