name: Deploy API

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag (commit SHA) to deploy for backend + worker.
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      EC2_HOST:
        required: true
      EC2_USER:
        required: true
      EC2_SSH_KEY:
        required: true
      EC2_SSH_PORT:
        required: false
      API_ENV_FILE:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API (backend + worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.prod.yaml
          sparse-checkout-cone-mode: false

      # Keeps the server's Compose file in sync with the repo (creates ~/knowledge-engine if missing).
      - name: Copy Compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: docker-compose.prod.yaml
          target: knowledge-engine

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
          # Read by docker-compose.prod.yaml to pick the image tags.
          BACKEND_TAG: ${{ inputs.image_tag }}
          WORKER_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,API_ENV_FILE,BACKEND_TAG,WORKER_TAG
          command_timeout: 10m
          script: |
            # Stop at the first failing command.
            set -eu
            cd ~/knowledge-engine

            # Runtime config for backend + worker. Only the owner can read it.
            printf '%s\n' "$API_ENV_FILE" > .env.api
            chmod 600 .env.api

            # Log in to Docker Hub, and log out when the script ends (even if a step fails).
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            trap 'docker logout' EXIT

            # Download the new images, then restart only backend + worker.
            # --no-deps: leave web alone. --wait: fail if a container doesn't become healthy within 3 minutes.
            docker compose -f docker-compose.prod.yaml pull backend worker
            docker compose -f docker-compose.prod.yaml up -d --no-deps --wait --wait-timeout 180 backend worker

            # Delete images no container uses any more (old versions).
            docker image prune -af
