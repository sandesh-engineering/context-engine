name: Build and Push Docker Images

on:
  workflow_call:
    inputs:
      images:
        description: JSON list of {name, dockerfile, target} to build (from quality.yml).
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.images) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build only (load: true puts it in the runner's local Docker). It is pushed after the Trivy scan,
      # so a vulnerable image never reaches Docker Hub.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          platforms: linux/amd64
          # Only the web image uses these (baked into the browser bundle). Set them as repo/environment variables.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/knowledge-engine-${{ matrix.name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/knowledge-engine-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Fails on HIGH/CRITICAL vulnerabilities (OS packages and npm dependencies inside the image)
      # that have a fixed version available, or on secrets baked into the image (e.g. a copied .env).
      # Accepted findings go in .trivyignore with a comment.
      - name: Scan image for vulnerabilities and secrets (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/knowledge-engine-${{ matrix.name }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true # unfixable CVEs can't be acted on, so they don't block
          exit-code: "1"

      # Only reached when the scan passed. Pushes both tags (commit SHA and latest).
      - name: Push image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/knowledge-engine-${{ matrix.name }}
        run: docker push --all-tags "$IMAGE"
