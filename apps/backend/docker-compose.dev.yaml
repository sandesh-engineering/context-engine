services:
  jaeger:
    image: jaegertracing/all-in-one:latest 
    ports:
      - '16686:16686'
      - '4317:4317'

  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-knowledge_engine}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-knowledge_engine}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reslab-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: knowledge_engine_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

    networks:
      - reslab-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      FLOCI_ROOT_USER: admin
      FLOCI_ROOT_PASSWORD: password123
    networks:
      - reslab-net


  # Optional cross-encoder reranker for chat retrieval (set RERANKER_URL=http://localhost:8081 to use it).
  # Start with: docker compose -f docker-compose.dev.yaml --profile reranker up -d reranker
  # The small default model suits low-RAM machines; BAAI/bge-reranker-base ranks better but needs ~1 GB more.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: frogtoberfest_reranker_dev
    profiles: [ "reranker" ]
    restart: unless-stopped
    # A small batch-token cap keeps memory low; 20 chunks of ~200 tokens still fit in one batch
    command: [ "--model-id", "${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}", "--max-batch-tokens", "4096" ]
    ports:
      - "8081:80"
    volumes:
      - reranker_models:/data
    networks:
      - reslab-net


volumes:
  ollama_data:
  postgres_data:
  pgadmin_data:
  data:
  reranker_models:

networks:
  reslab-net:
    name: reslab-knowledge-engine-net
    driver: bridge
