name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      since:
        description: Only rebuild/deploy apps changed since this git ref (e.g. last deployed SHA). Empty = everything.
        type: string
        default: ""
      image_tag:
        description: Rollback/redeploy - deploy this existing tag (a past commit SHA) and skip quality + build.
        type: string
        default: ""
      apps:
        description: With image_tag only - "backend" (deploys backend + worker) and/or "web".
        type: string
        default: backend web

permissions:
  contents: read

concurrency:
  group: knowledge-engine-deployment
  cancel-in-progress: false

jobs:
  quality:
    if: inputs.image_tag == ''
    uses: ./.github/workflows/quality.yml
    with:
      since: ${{ inputs.since }}

  build-and-push:
    uses: ./.github/workflows/build-image.yml
    needs: quality
    if: needs.quality.outputs.images != '[]' # nothing changed -> skip build (and deploy)
    with:
      images: ${{ needs.quality.outputs.images }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # How to read the deploy conditions:
  #   !cancelled()           run even if a job in `needs` was skipped or failed (but not if the
  #                          whole run was cancelled). Without it, one skipped job would skip the deploy.
  #   refs/heads/main        production deploys only from main.
  #   then one of two cases:
  #     normal deploy        this app changed AND its images were built successfully
  #     rollback             image_tag was given AND this app is listed in `apps`

  # Deploys backend + worker.
  deploy-api:
    needs: [quality, build-and-push]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (
        (needs.quality.outputs.backend_changed == 'true' && needs.build-and-push.result == 'success') ||
        (inputs.image_tag != '' && contains(inputs.apps, 'backend'))
      )
    uses: ./.github/workflows/deploy-api.yml
    with:
      image_tag: ${{ inputs.image_tag || github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
      API_ENV_FILE: ${{ secrets.API_ENV_FILE }}

  # Deploys web. Waits for deploy-api so the two never touch the server at the same time, but
  # does NOT depend on it: if the backend didn't change (deploy-api skipped) or deploy-api
  # failed, this still runs, because the condition only looks at web.
  deploy-frontend:
    needs: [quality, build-and-push, deploy-api]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (
        (needs.quality.outputs.web_changed == 'true' && needs.build-and-push.result == 'success') ||
        (inputs.image_tag != '' && contains(inputs.apps, 'web'))
      )
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      image_tag: ${{ inputs.image_tag || github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
      FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}
