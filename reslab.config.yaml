# ResLab Configuration (https://github.com/sandesh-engineering/ResLab)
# Generated by 'reslab init'

version: "1.0"
project: knowledge-engine
containerPrefix: knowledge-engine
architecture: monolith
app:
  name: knowledge-engine-app
  environment: host
  baseUrl: http://localhost:5001/api/v1
  metricsEndpoint: /metrics
services: []
modules:
  - application
  - tracing
  - postgresql
  - logs
ports:
  grafana: 3001
  prometheus: 9090
  jaegerUi: 16686
  loki: 3100
  otelOtlpGrpc: 4317
  otelOtlpHttp: 4318
  toxiproxyApi: 8474
infrastructure:
  postgres:
    enabled: true
    host: postgres
    port: 5432
    database: knowledge_engine
    user: postgres
    password: ${DB_PASSWORD:-postgres}
    ssl: false
    pgStatStatements: true
safety:
  allowedHosts:
    - localhost
    - 127.0.0.1
    - host.docker.internal
  maxDurationSeconds: 300
  requireConfirmation: true
